# Planted faults for `make mutants` (plan task 1.4.2; scripts/mutants.py
# documents the format, docs/development/TESTING_STRATEGY.md the use).
# Each fault changes one exact text of one file, in a temporary copy of
# the tree, and names the test that must then fail. A fault that no test
# can catch is listed with `equivalent` (it behaves as the original) or
# `gap` (a test is missing), with the reason. When code changes under an
# entry, the runner reports it stale: re-target the fault at the new code
# (or delete it if the code it broke is gone), never just drop the check.
#
# Sources: faults first planted by hand, in scratch scripts since lost, by
# the reviews of check-declaration (reasons starting "CD"), of the rejection
# rules ("K1"), the checked environment's fourth review (all 9, "X5"), the
# coverage review (T2, N1) and the JSON writer's, re-created here; and new
# ones.

