new = ''': remap-anonymous ( head remap -- head' ) drop ;'''
test = "$GFORTH tests/front/constructions.fs"
reason = "erasing keeps binder names and information: two binders differing only in them are not alike"

[[fault]]
id = "fe6-never-clean"
file = "src/front/expr-remap.fs"
old = ''': remap-clean? ( e remap -- flag ) tuck remap-tier@ expr-data@ swap remap-changes? 0= ;'''
new = ''': remap-clean? ( e remap -- flag ) 2drop true ;'''
test = "$GFORTH tests/front/constructions.fs"
reason = "nothing is renumbered: the shift and swap tests and every reordered casesOn"

[[fault]]
