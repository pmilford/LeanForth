# Planted faults of check's default number of workers (owner, 2026-11-23: "make the jobs
# default 4, so the rest of the computer is still ok to run"; branch jobs-default): 4 workers
# for check of an export or a snapshot, one for a LeanForth text and for print, --jobs N as
# given, and the resource report saying where the count came from (src/cli/leanforth.fs
# cli-workers, cli-jobs-from.). Read with tests/mutants/faults.toml as one list.

[[fault]]
id = "jd-default-serial"
file = "src/cli/leanforth.fs"
old = '''4 constant cli-jobs-default'''
new = '''1 constant cli-jobs-default'''
test = "$GFORTH tests/cli/leanforth.fs"
reason = "the default stays one worker at a time: check without --jobs is not the owner's 4"
quick = true

[[fault]]
id = "jd-explicit-ignored"
file = "src/cli/leanforth.fs"
old = ''': cli-workers ( -- n ) cli-jobs ?dup 0= if cli-jobs-unset then ;'''
new = ''': cli-workers ( -- n ) cli-jobs-unset ;'''
test = "$GFORTH tests/cli/leanforth.fs"
reason = "an explicit --jobs N is replaced by the default: --jobs 1 no longer checks one at a time"

[[fault]]
id = "jd-text-default-parallel"
file = "src/cli/leanforth.fs"
old = '''  cli-takes-jobs? cli-text-file? 0= and if cli-jobs-default else 1 then ;'''
new = '''  cli-takes-jobs? if cli-jobs-default else 1 then ;'''
test = "$GFORTH tests/cli/leanforth.fs"
reason = "a LeanForth text with no --jobs tries workers that cannot share its input (a feed wasted, a workers line in --resources)"

[[fault]]
id = "jd-print-default-parallel"
file = "src/cli/leanforth.fs"
old = ''': cli-takes-jobs? ( -- flag ) cli-state arg-set @ takes-jobs and 0<> ;'''
new = ''': cli-takes-jobs? ( -- flag ) true ;'''
test = "$GFORTH tests/cli/leanforth.fs"
reason = "print, which takes no --jobs, makes and feeds 4 workers it never uses"

[[fault]]
id = "jd-default-unused"
file = "src/cli/leanforth.fs"
old = '''  cli-stale? snap-stale-allowed ! cli-workers ck-jobs!'''
new = '''  cli-stale? snap-stale-allowed ! cli-jobs ck-jobs!'''
test = "python3 tests/cli/test_leanforth.py Jobs.test_default_workers"
reason = "the run ignores the default: check without --jobs still checks one declaration at a time"

[[fault]]
id = "jd-default-said-jobs"
file = "src/cli/leanforth.fs"
old = ''': cli-jobs-from. ( -- ) cli-jobs if ."  (--jobs)" else ."  (the default)" then ;'''
new = ''': cli-jobs-from. ( -- ) ."  (--jobs)" ;'''
test = "$GFORTH tests/cli/leanforth.fs"
reason = "the resource report credits the default's workers to a --jobs option the user never gave"
