# Planted faults of check's default number of workers (owner, 2026-11-23: "make the jobs
# default 4, so the rest of the computer is still ok to run"; branch jobs-default): 4 workers
# for check of an export or a snapshot, one for a LeanForth text and for print, --jobs N as
# given, and the resource report saying where the count came from (src/cli/leanforth.fs
# cli-workers, cli-jobs-from.). Read with tests/mutants/faults.toml as one list.

[[fault]]
id = "jd-default-serial"
file = "src/cli/leanforth.fs"
old = '''4 constant cli-jobs-default'''
new = '''1 constant cli-jobs-default'''
test = "$GFORTH tests/cli/leanforth.fs"
reason = "the default stays one worker at a time: check without --jobs is not the owner's 4"
quick = true

[[fault]]
id = "jd-explicit-ignored"
file = "src/cli/leanforth.fs"
old = ''': cli-workers ( -- n ) cli-jobs dup 0= cli-jobs-unset and or ;'''
new = ''': cli-workers ( -- n ) cli-jobs-unset ;'''
test = "$GFORTH tests/cli/leanforth.fs"
reason = "an explicit --jobs N is replaced by the default: --jobs 1 no longer checks one at a time"

[[fault]]
id = "jd-text-default-parallel"
file = "src/cli/leanforth.fs"
old = '''  cli-takes-jobs? cli-text-file? 0= and if cli-jobs-default else 1 then ;'''
new = '''  cli-takes-jobs? if cli-jobs-default else 1 then ;'''
test = "$GFORTH tests/cli/leanforth.fs"
reason = "a LeanForth text with no --jobs tries workers that cannot share its input (a feed wasted, a workers line in --resources)"

[[fault]]
id = "jd-print-default-parallel"
file = "src/cli/leanforth.fs"
old = ''': cli-takes-jobs? ( -- flag ) cli-state arg-set @ takes-jobs and 0<> ;'''
new = ''': cli-takes-jobs? ( -- flag ) true ;'''
test = "$GFORTH tests/cli/leanforth.fs"
reason = "print, which takes no --jobs, makes and feeds 4 workers it never uses"

[[fault]]
id = "jd-default-unused"
file = "src/cli/leanforth.fs"
old = '''  cli-stale? snap-stale-allowed ! cli-workers ck-jobs!'''
new = '''  cli-stale? snap-stale-allowed ! cli-jobs ck-jobs!'''
test = "python3 tests/cli/test_leanforth.py Jobs.test_default_workers"
reason = "the run ignores the default: check without --jobs still checks one declaration at a time"

[[fault]]
id = "jd-default-said-jobs"
file = "src/cli/leanforth.fs"
old = ''': cli-jobs-from. ( -- ) cli-jobs if ."  (--jobs)" else ."  (the default)" then ;'''
new = ''': cli-jobs-from. ( -- ) ."  (--jobs)" ;'''
test = "$GFORTH tests/cli/leanforth.fs"
reason = "the resource report credits the default's workers to a --jobs option the user never gave"

# Performance monitoring in --resources (owner, 2026-11-23: "the stall time monitor should be
# there, along with other performance monitoring items"; same branch): the plan's and the jobs'
# run's times, each worker's and the driving task's busy and waiting time, the save phase
# (src/kernel/env-schedule.fs lf-sch-timed-check, lf-sch-timed-wait; src/cli/check-run.fs;
# the text in src/cli/leanforth.fs, the JSON in src/cli/check-json.fs).

[[fault]]
id = "jd-busy-uncounted"
file = "src/kernel/env-schedule.fs"
old = ''': lf-sch-timed-check ( -- ) lf-sched lf-sch-check @ lf-sch-timing lf-sch-busy d+! ;'''
new = ''': lf-sch-timed-check ( -- ) lf-sched lf-sch-check @ lf-sch-timing 2drop ;'''
test = "$GFORTH tests/cli/leanforth.fs"
reason = "no worker's checks are timed: every worker is reported idle the whole run"
quick = true

[[fault]]
id = "jd-time-under-check"
file = "src/kernel/env-schedule.fs"
old = ''': lf-sch-timed-check ( -- ) lf-sched lf-sch-check @ lf-sch-timing lf-sch-busy d+! ;'''
new = ''': lf-sch-timed-check ( -- ) lf-sch-now lf-sched lf-sch-check @ execute lf-sch-now 2swap d-floor lf-sch-busy d+! ;'''
test = "$GFORTH tests/cli/leanforth.fs"
reason = "the start time lies between the job's sentinel and the check: a check that replaces the cell below it rewrites the time, the guard misses it and its declaration is published accepted in a worker where the serial run finds it invalid and stops"
quick = true

[[fault]]
id = "jd-wait-uncounted"
file = "src/kernel/env-schedule.fs"
old = ''': lf-sch-timed-wait ( -- k ) ['] lf-sch-any-end lf-sch-timing lf-sched lf-sch-waited d+! ;'''
new = ''': lf-sch-timed-wait ( -- k ) lf-sch-any-end ;'''
test = "$GFORTH tests/cli/leanforth.fs"
reason = "the driving task's waits are not counted: it is reported busy the whole run, never stalled"

[[fault]]
id = "jd-clock-unset"
file = "src/cli/check-run.fs"
old = ''': ck-sched-words! ( -- ) ck-tick! ck-pre! ['] ck-wall-now lf-sched-clock! ;'''
new = ''': ck-sched-words! ( -- ) ck-tick! ck-pre! ;'''
test = "$GFORTH tests/cli/leanforth.fs"
reason = "the scheduler gets no clock: every busy and waiting time is 0"

[[fault]]
id = "jd-run-untimed"
file = "src/cli/check-run.fs"
old = ''': ck-sched-timed ( -- ) ck-sub-begin ck-sched-run ck-state ck-jobs-time ck-sub-end ;'''
new = ''': ck-sched-timed ( -- ) ck-sched-run ;'''
test = "$GFORTH tests/cli/leanforth.fs"
reason = "the jobs' run is not timed: busy and waiting no longer add up to it"

[[fault]]
id = "jd-plan-untimed"
file = "src/cli/check-run.fs"
old = ''': ck-planned ( -- outcome ) ck-sub-begin lf-sched-plan ck-state ck-plan-time ck-sub-end ;'''
new = ''': ck-planned ( -- outcome ) lf-sched-plan ;'''
test = "$GFORTH tests/cli/leanforth.fs"
reason = "the plan's time is reported as 0"

[[fault]]
id = "jd-waiting-is-busy"
file = "src/cli/check-run.fs"
old = ''': ck-waiting ( k -- d ) lf-sched-busy ck-less ;'''
new = ''': ck-waiting ( k -- d ) lf-sched-busy ;'''
test = "$GFORTH tests/cli/leanforth.fs"
reason = "a worker's waiting time is its busy time, not the rest of the run"

[[fault]]
id = "jd-save-always-shown"
file = "src/cli/check-run.fs"
old = ''': ck-phase-shown? ( k -- flag ) ck-saving <> ck-save-tried? ck-resources? and or ;'''
new = ''': ck-phase-shown? ( k -- flag ) drop true ;'''
test = "$GFORTH tests/cli/leanforth.fs"
reason = "every report shows a save phase, also when no snapshot was to be written"

[[fault]]
id = "jd-save-never-shown"
file = "src/cli/check-run.fs"
old = '''  true ck-state ck-save-tried ! ck-phase-begin ck-snapshot-saving ck-saving ck-phase-end ;'''
new = '''  ck-phase-begin ck-snapshot-saving ck-saving ck-phase-end ;'''
test = "$GFORTH tests/cli/leanforth.fs"
reason = "the save is timed but never reported"

[[fault]]
id = "jd-workers-json-missing"
file = "src/cli/check-json.fs"
old = '''  ck-spent? if s" workers" cj-key cj-workers-body then ;'''
new = '''  ck-spent? drop ;'''
test = "$GFORTH tests/cli/leanforth.fs"
reason = "the JSON report of a run with workers has no measured workers member"

[[fault]]
id = "jd-spent-unreported"
file = "src/cli/leanforth.fs"
old = '''  ." resources:" cr cli-times. cli-memory. cli-engine. cli-jobs. cli-spent. cli-input.'''
new = '''  ." resources:" cr cli-times. cli-memory. cli-engine. cli-jobs. cli-input.'''
test = "python3 tests/cli/test_leanforth.py Jobs.test_spent"
reason = "--resources leaves out the plan, the jobs' run and every task's busy and waiting time"

[[fault]]
id = "jd-last-throw-unstopped"
file = "src/cli/check-run.fs"
old = '''  ck-jobs-stepped dup ck-state ck-stepped ! dup ck-jobs-stopped? ck-stop! drop'''
new = '''  ck-jobs-stepped dup ck-state ck-stepped ! dup lf-input-count < ck-stop! drop'''
test = "python3 tests/cli/test_leanforth.py ExitCodes.test_5_thrown"
reason = "with workers, a THROW in the last declaration's check is not a stopped run: exit 4 and no stop line, where the serial run gives 5"

# Only with --resources (the coordinator's decision of 2026-11-24 under the owner's approval
# of an additive change, review finding 2): a check --json report without it is as before.

[[fault]]
id = "jd-workers-unasked"
file = "src/cli/check-run.fs"
old = ''': ck-spent? ( -- flag ) ck-jobs-run? ck-timed? and ck-resources? and ;'''
new = ''': ck-spent? ( -- flag ) ck-jobs-run? ck-timed? and ;'''
test = "$GFORTH tests/cli/leanforth.fs"
reason = "every check --json report of a run with workers gains measured.workers, without --resources: a report main's schema refuses"

[[fault]]
id = "jd-save-unasked"
file = "src/cli/check-run.fs"
old = ''': ck-phase-shown? ( k -- flag ) ck-saving <> ck-save-tried? ck-resources? and or ;'''
new = ''': ck-phase-shown? ( k -- flag ) ck-saving <> ck-save-tried? or ;'''
test = "$GFORTH tests/cli/leanforth.fs"
reason = "check --json --save-snapshot without --resources gains a save member in measured.microseconds: a report main's schema refuses"

[[fault]]
id = "jd-resources-unpassed"
file = "src/cli/leanforth.fs"
old = '''  cli-any-lean? ck-any-version! cli-resources? ck-resources! cli-progress-apply'''
new = '''  cli-any-lean? ck-any-version! cli-progress-apply'''
test = "python3 tests/cli/test_leanforth.py Jobs.test_spent"
reason = "--resources gives neither the workers' times nor the save phase, in text or JSON"

# Double-cell counters in the library (review finding 3): src/lib/bounds.fs's d+! and d-floor,
# in place of copies in env-schedule.fs, check-run.fs, ndjson-count.fs, run-record.fs and
# manifest.fs.

[[fault]]
id = "jd-d-add-overwrites"
file = "src/lib/bounds.fs"
old = ''': d+! ( d addr -- ) dup >r 2@ d+ r> 2! ;'''
new = ''': d+! ( d addr -- ) 2! ;'''
test = "$GFORTH tests/lib/lib.fs"
reason = "a double in memory is overwritten, not added to: a worker's busy time is its last check's, a byte count its last line's"

[[fault]]
id = "jd-d-floor-negative"
file = "src/lib/bounds.fs"
old = ''': d-floor ( d1 d2 -- d ) d- 0 0 dmax ;'''
new = ''': d-floor ( d1 d2 -- d ) d- ;'''
test = "$GFORTH tests/lib/lib.fs"
reason = "a difference of a wall clock set back goes negative: a lap, a busy or waiting time below zero"
