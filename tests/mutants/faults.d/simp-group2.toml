# Planted faults of the second simp group (plan row FE9, docs/design/TACTIC_SIMP.md): slice
# SL1a-2 (simp/goal.fs's simpGoal, assert.fs's replaceLocalDeclDefEq and assertHypotheses,
# lctx-views.fs's lf-local-refvar, term-eqv.fs's lf-meta-equal?) and plan row 9.4.8z2(e)'s
# rule errors (tactics/simp-only.fs); read with faults.toml as one list (scripts/mutants.py).
# Each is caught by tests/front/tactics/simp-2/test.fs.

[[fault]]
id = "at-erases-bracket-h"
file = "src/front/simp/goal.fs"
old = '''  dup sg sg-fvar ! lf-fvar-type lf-instantiate! dup sg sg-max @ lf-simp'''
new = '''  dup sg sg-fvar ! lf-simp-set-new lf-fvar-type lf-instantiate! dup sg sg-max @ lf-simp'''
test = "$GFORTH tests/front/tactics/simp-2/test.fs"
reason = "SL1a-2: eraseTheorem (.fvar h) taken to erase the bracket rules too (origin .stx), so simp only [h] at h leaves h, where Lean rewrites it to True"

[[fault]]
id = "false-hyp-kept"
file = "src/front/simp/goal.fs"
old = '''  over >r sg-fvar@ sg-mp r> dup sg-false? if drop sg-close true exit then sg-kept false ;'''
new = '''  over >r sg-fvar@ sg-mp r> dup sg-false? 0 and if drop sg-close true exit then sg-kept false ;'''
test = "$GFORTH tests/front/tactics/simp-2/test.fs"
reason = "SL1a-2: applySimpResult's mayCloseGoal ignored, so a hypothesis simplified to False is asserted and the goal left open"

[[fault]]
id = "progress-unchecked"
file = "src/front/simp/goal.fs"
old = '''  dup sg sg-orig @ = if lfa-e-simp-progress lf-tac-stop then ;'''
new = '''  dup sg sg-orig @ = drop ;'''
test = "$GFORTH tests/front/tactics/simp-2/test.fs"
reason = "SL1a-2: failIfUnchanged skipped, so simp at h with nothing to rewrite succeeds where Lean says no progress"

[[fault]]
