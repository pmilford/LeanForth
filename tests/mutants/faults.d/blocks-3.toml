# Planted faults of tactic blocks, slice 3 (plan row TB2, piece F; design
# docs/design/TACTIC_BLOCKS.md 4): by-try, by-first, by-repeat and by-any-goals, the runner's
# handlers and tfr-sorry (tactic-run.fs) and the reader's bare alternatives
# (tactic-syntax.fs), read with faults.toml as one list (scripts/mutants.py). Each is caught
# by the test it names. The design's recover faults not new here are blocks-1's:
# tb2b1-recover-not-inherited, tb2b1-have-by-not-fresh, tb2b1-log-fail-thrown,
# tb2b1-lean-bit-every-invalid.

# ---- The design's (TACTIC_BLOCKS.md 4, slice 3)
