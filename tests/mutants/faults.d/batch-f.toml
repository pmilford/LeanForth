# Planted faults of tactic batch 3c (plan row TB2: src/author/scopes.fs's brackets,
# runner.fs's reading on and source.fs's lfa-read!, declarations.fs's and elab-decl.fs's
# checks for an open list, src/front/tactic-syntax.fs's lists,
# reader.fs's << >>, elab-term.fs's anonymous constructor and lf-elab-final,
# elab-pending.fs's message rest, tactic-core.fs's detail, src/front/tactics/exists.fs),
# read with faults.toml as one list (scripts/mutants.py). Each is caught by the test it
# names (tests/front/tactics/batch-f/test.fs or its check.py), unless it says why not
# (gap, equivalent).

# ---- scopes.fs: brackets
[[fault]]
id = "tb3c-frame-no-bracket"
file = "src/author/scopes.fs"
old = ''': lfa-frame ( -- depth ) lfa-binder-frame lfa-bracketed? if lfb lfb-mark @ max then ;'''
new = ''': lfa-frame ( -- depth ) lfa-binder-frame ;'''
test = "$GFORTH tests/front/tactics/batch-f/test.fs"
reason = "TB2 3c: a word inside << >> takes values from before << (not missing values)"

[[fault]]
id = "tb3c-closer-any"
file = "src/author/scopes.fs"
old = '''  drop lfa-list-closer <> if lfa-list-unclosed then ;'''
new = '''  2drop ;'''
test = "$GFORTH tests/front/tactics/batch-f/test.fs"
reason = "TB2 3c: ] closes a << and >> a by-rw[ (not 458 at the open list's word)"

[[fault]]
id = "tb3c-bracket-binders-any"
file = "src/author/scopes.fs"
old = '''  lfa-depth lfb lfb-binders @ = if exit then'''
new = '''  exit'''
test = "$GFORTH tests/front/tactics/batch-f/test.fs"
reason = "TB2 3c: a binder opened inside << >> stays open past >> (not error 21)"

[[fault]]
id = "tb3c-brackets-never-open"
file = "src/author/scopes.fs"
old = ''': lfa-brackets-closed ( -- ) lfa-bracketed? if lfa-list-unclosed then ;'''
new = ''': lfa-brackets-closed ( -- ) ;'''
test = "$GFORTH tests/front/tactics/batch-f/test.fs"
reason = "TB2 3c: a tactic word, end or := inside a list is read (not 458 at the list's word)"

[[fault]]
id = "tb3c-items-one-more"
file = "src/author/scopes.fs"
old = ''': lfb-items ( -- n pos ) depth lfb lfb-mark @ - lfb lfb-at @ ;'''
new = ''': lfb-items ( -- n pos ) depth lfb lfb-mark @ - 1+ lfb lfb-at @ ;'''
test = "$GFORTH tests/front/tactics/batch-f/test.fs"
reason = "TB2 3c: a list's items counted one too many (a value from before it taken)"

