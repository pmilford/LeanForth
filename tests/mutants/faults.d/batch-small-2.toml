# Planted faults of small tactics 2 (plan row 9.4.8z12: elab-calc.fs, tactics/calc.fs,
# tactics/with-reducible.fs, the runner's frame transparency in tactic-run.fs, the transparency
# in force of meta-must.fs's lf-tac-defeq and elab-decl.fs's lf-elab-configured, and
# meta-tactic/goal.fs's checkedAssign of a value with an open metavariable), read with
# faults.toml as one list (scripts/mutants.py). Each is caught by the test it names
# (tests/front/tactics/batch-small-2/test.fs).

[[fault]]
