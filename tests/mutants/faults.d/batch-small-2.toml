# The Forth review of small tactics 2 (2026-11-26) and its fix round: B1 (calc's new goals in
# front), B2 (rw's closing rfl at reducible, the tactics' transparency included; Init's hint
# on a Not side), M1, M2, Low 1, Low 2.
# Known gaps (the review's Low 3), planted by the reviewer and not caught, as no text reaches
# them yet: rv-fits-rhs-type-skipped (calc.fs's tcx-fits?, the extension's condition that the
# chain's right side has the goal's left side's type: every relation LeanForth can write is
# homogeneous, so that type always agrees once the left sides do); rv-uv-swapped
# (elab-calc.fs's ecl-chain!, Trans's u and v swapped: both are 0 for every relation in Prop,
# and a relation valued in Type has no LeanForth form yet); rv-ascribed-always (elab-term.fs's
# et-ascribed, the ascription taking the place of an expected type a hole was given: calc
# elaborates T with no expected type, so no ascribed hole is ever given one; probably
# equivalent).

