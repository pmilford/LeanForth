# Planted faults of the fixes of the Forth review of slice S3a
# (docs/development/forth-reviews/2026-11-19-s3a-decide.md), read with
# faults.toml as one list (scripts/mutants.py). The slice's own are in
# s3a.toml and decide.toml.

# --- B4: lib/texts.fs's texts-index ------------------------------------------

[[fault]]
id = "s3a-texts-index-from-one"
file = "src/lib/texts.fs"
old = '''  0 begin over c@ while >r texts-hit? r> swap if nip nip nip exit then'''
new = '''  1 begin over c@ while >r texts-hit? r> swap if nip nip nip exit then'''
test = "$GFORTH tests/lib/texts.fs"
reason = "review s3a-decide B4: the entries counted from 1, so every hit's index is one too many"

[[fault]]
id = "s3a-texts-index-miss-zero"
file = "src/lib/texts.fs"
old = '''    1+ swap text-next swap repeat 2drop 2drop -1 ;'''
new = '''    1+ swap text-next swap repeat 2drop 2drop 0 ;'''
test = "$GFORTH tests/lib/texts.fs"
reason = "review s3a-decide B4: a search that finds no text answers 0, the first entry's index, instead of -1"

# --- B1: one Nat.succ name test, core/nat-ops.fs's ---------------------------

[[fault]]
id = "s3a-kernel-succ-any-nat-name"
file = "src/kernel/whnf.fs"
old = '''  case 1 of lf-nat-succ-name? endof  2 of lf-whnf-binary? endof'''
new = '''  case 1 of lf-nat-name? endof  2 of lf-whnf-binary? endof'''
test = "$GFORTH tests/core/defeq.fs"
reason = "review s3a-decide B1: the kernel's reduce_nat match takes any Nat.x of one argument (Nat.pred, Nat.zero) for Nat.succ"

# --- B5: core/literals.fs's lf-lit-u> and its callers -------------------------

[[fault]]
id = "s3a-lit-u-signed"
file = "src/core/literals.fs"
old = '''  over lf-lit-small? if swap lf-lit-cell u< else 2drop true then ;'''
new = '''  over lf-lit-small? if swap lf-lit-cell < else 2drop true then ;'''
test = "$GFORTH tests/core/nat-ops.fs"
reason = "review s3a-decide B5: a literal of one limb with the top bit set compared signed, so it is taken for one below 1"

[[fault]]
id = "s3a-lit-u-big-below"
file = "src/core/literals.fs"
old = '''  over lf-lit-small? if swap lf-lit-cell u< else 2drop true then ;'''
new = '''  over lf-lit-small? if swap lf-lit-cell u< else 2drop false then ;'''
test = "$GFORTH tests/core/nat-ops.fs"
reason = "review s3a-decide B5: a literal of two limbs taken for one within the bound, so 1 shifted left by 2^64 is computed as a shift by its low limb, 0, instead of full"

[[fault]]
id = "s3a-kernel-count-bound-low"
file = "src/kernel/reduce-nat.fs"
old = ''': lf-rn-count? ( lit -- flag ) $FFFFFFFF lf-lit-u> 0= ;'''
new = ''': lf-rn-count? ( lit -- flag ) $FFFFFFFE lf-lit-u> 0= ;'''
test = "$GFORTH tests/core/reduce-nat.fs"
reason = "review s3a-decide B5: get_count_arg's bound one too low, so 1 ^ (2^32 - 1) is refused where Lean computes it"

# --- B3: mkDecide through mkAppOptM ------------------------------------------

[[fault]]
id = "s3a-decide-p-dropped"
file = "src/front/app-builder.fs"
old = ''': lf-mk-decide ( p -- e ) s" Decidable.decide" rot 0 1 2 lf-mk-app-opt-m ;'''
new = ''': lf-mk-decide ( p -- e ) s" Decidable.decide" rot 0 0 2 lf-mk-app-opt-m ;'''
test = "$GFORTH tests/front/tactics/decide/test.fs"
reason = "review s3a-decide B3: mkDecide's entries #[p, none] given as #[none, none], so P is dropped and decide's proposition is a new metavariable"
