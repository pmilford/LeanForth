reason = "review s3a-decide B5: a literal of two limbs taken for one within the bound, so 1 shifted left by 2^64 is computed as a shift by its low limb, 0, instead of full"

[[fault]]
id = "s3a-kernel-count-bound-low"
file = "src/kernel/reduce-nat.fs"
old = ''': lf-rn-count? ( lit -- flag ) $FFFFFFFF lf-lit-u> 0= ;'''
new = ''': lf-rn-count? ( lit -- flag ) $FFFFFFFE lf-lit-u> 0= ;'''
