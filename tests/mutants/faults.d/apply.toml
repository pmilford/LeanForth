# Planted faults of by-apply and the goal layer's apply (slice a2-iii;
# src/front/tactics/apply.fs, src/front/meta-tactic/apply.fs, goal.fs and
# telescope.fs's bounded telescope), read with faults.toml as one list
# (scripts/mutants.py).

[[fault]]
id = "apply-range-from-zero"
file = "src/front/meta-tactic/apply.fs"
old = '''  ap ap-target @ lf-expected-num-args drop - 0 max ap ap-lower ! ;'''
new = '''  ap ap-target @ lf-expected-num-args 2drop drop 0 ap ap-lower ! ;'''
test = "GFORTH=$GFORTH python3 tests/front/tactics/apply/check.py"
reason = "a2-iii: the range of argument counts starts at 0, not numArgs less the goal's (Lean's rangeNumArgs; the error says type for conclusion)"

[[fault]]
id = "apply-dependent-first"
file = "src/front/meta-tactic/apply.fs"
old = ''': ap-result ( -- goals ) 0 false ap-those true ap-those ;'''
new = ''': ap-result ( -- goals ) 0 true ap-those false ap-those ;'''
test = "GFORTH=$GFORTH python3 tests/front/tactics/apply/check.py"
reason = "a2-iii: reorderGoals puts the dependent goals first (Nat.le_trans's m before h₁, h₂)"

[[fault]]
