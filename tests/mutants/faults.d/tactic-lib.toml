# Planted faults of the tactic library (plan slice a2-i; src/front/meta-must.fs,
# app-builder.fs, telescope.fs), read with faults.toml as one list
# (scripts/mutants.py). Five entries moved here from faults.toml when their code
# moved into the library (ids kept).

# --- meta-must.fs ------------------------------------------------------------

[[fault]]
id = "lib-must-ok-thrown"
file = "src/front/meta-must.fs"
old = '''  dup ok? if drop exit then outcome-sane lf-meta-throw-base swap - throw ;'''
new = '''  outcome-sane lf-meta-throw-base swap - throw ;'''
test = "$GFORTH tests/front/tactic-lib.fs"
reason = "a2-i: lf-must throws for ok too, so every library word fails"

[[fault]]
id = "lib-must-unsupported-rejected"
file = "src/front/meta-must.fs"
old = '''  dup ok? if drop exit then outcome-sane lf-meta-throw-base swap - throw ;'''
new = '''  dup ok? if drop exit then outcome-sane dup outcome-unsupported = if drop outcome-rejected then lf-meta-throw-base swap - throw ;'''
test = "$GFORTH tests/front/tactic-lib.fs"
reason = "a2-i fail-closed rule: unsupported thrown as rejected (a gap of LeanForth's told as a wrong input)"

[[fault]]
id = "lib-thrown-ok-range"
file = "src/front/meta-must.fs"
old = '''  lf-meta-throw-base swap - outcome-invalid outcome-full 1+ within ;'''
new = '''  lf-meta-throw-base swap - outcome-ok outcome-full 1+ within ;'''
test = "$GFORTH tests/front/tactic-lib.fs"
reason = "a2-i: -4200 (ok) read as a failure's code"

[[fault]]
id = "lib-catch-failure-ok"
file = "src/front/meta-must.fs"
old = '''  lfm-caught 2r> rot >r >r lfm-drops r> lfm-nones r> ;'''
new = '''  lfm-caught 2r> rot >r >r lfm-drops r> lfm-nones r> drop outcome-ok ;'''
test = "$GFORTH tests/front/tactic-lib.fs"
reason = "a2-i fail-closed rule: lf-meta-catch hands back ok for a failure"

[[fault]]
id = "lib-catch-swallows-other"
file = "src/front/meta-must.fs"
old = ''': lfm-caught ( code -- outcome ) dup lf-meta-thrown? 0= if throw then lf-meta-outcome ;'''
new = ''': lfm-caught ( code -- outcome ) dup lf-meta-thrown? 0= if drop outcome-invalid exit then lf-meta-outcome ;'''
test = "$GFORTH tests/front/tactic-lib.fs"
reason = "a2-i: an authoring error or internal fault caught as a Meta failure instead of passed on"

[[fault]]
id = "lib-commit-kept-on-throw"
file = "src/front/meta-must.fs"
old = '''  lf-mctx-mark lf-must >r catch ?dup if r> lfm-undo throw then r> lfm-settle ;'''
new = '''  lf-mctx-mark lf-must >r catch ?dup if r> lf-mctx-commit drop throw then r> lfm-settle ;'''
test = "$GFORTH tests/front/tactic-lib.fs"
reason = "a2-i commitWhen: a THROW keeps the attempt's assignments"

[[fault]]
id = "lib-commit-kept-on-false"
file = "src/front/meta-must.fs"
old = '''  over if lf-mctx-commit else lfm-undo outcome-ok then lf-must ;'''
new = '''  lf-mctx-commit lf-must ;'''
test = "$GFORTH tests/front/tactic-lib.fs"
reason = "a2-i commitWhen: false keeps the attempt's assignments"

[[fault]]
id = "fe-step-view-kept"
file = "src/front/meta-must.fs"
old = '''  swap lfm-view lf-mctx-view >r lf-mctx-view! catch r> lf-mctx-view! throw ;'''
new = '''  swap lfm-view lf-mctx-view >r lf-mctx-view! execute r> lf-mctx-view! ;'''
test = "$GFORTH tests/front/tactic-basic.fs"
reason = "FE1g-4 review fe1g3 L10 (moved to lf-with-goal, a2-i): a step that fails leaves its goal's context current"

