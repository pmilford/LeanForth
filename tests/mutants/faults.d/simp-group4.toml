# Planted faults of simp group 4 (plan row FE9, docs/design/TACTIC_SIMP.md;
# the plan .claude/work/briefs/simp-group-4-architect.md section 3): the
# re-entrant walk (src/front/simp/main.fs, rewrite.fs), the shared ranked-record
# index (src/front/data-index.fs), the default-set records of format 4.1
# (src/front/simp-set-data.fs) and the default set (src/front/simp/default-set.fs).

[[fault]]
id = "cands-shared-nested"
file = "src/front/simp/rewrite.fs"
old = ''': sr-pair ( i -- thm extra ) 2* srt srt-cands @ + sr-cands slab-at 2@ swap ;'''
new = ''': sr-pair ( i -- thm extra ) 2* sr-cands slab-at 2@ swap ;'''
test = "$GFORTH tests/front/tactics/simp-4/test.fs"
reason = "every call reads its candidates from cell 0, the outermost call's: a discharger's nested rewrite of x + 0 tries the outer call's first hypothesis and leaves x + 0 as it is"

[[fault]]
id = "rewrite-frame-shared"
file = "src/front/simp/rewrite.fs"
old = ''': srt ( -- addr ) sr-frames slab-last ;'''
new = ''': srt ( -- addr ) sr-frames slab-base ;'''
