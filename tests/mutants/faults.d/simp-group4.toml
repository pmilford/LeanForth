# The review of simp group 4 (docs/development/forth-reviews/2026-11-26-simp-group-4.md):
# B1 every simproc by its row, B2 a rank taken twice or a gap refused, B3 the rows sealed,
# B4 bytes-before.

[[fault]]
id = "sg4r-shift-shift-lit"
file = "src/front/simp/simprocs.fs"
old = '''' sp-crude-port 0 6 false false
lf-simproc: HShiftRight.hShiftRight BitVec.reduceShiftRightShiftRight'''
