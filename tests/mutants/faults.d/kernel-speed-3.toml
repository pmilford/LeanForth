# Planted faults of group kernel-speed-3 (2026-11-25; plan 9.4.8z7), the
# prototype's four changes landed: stored hashes in lib/htab.fs's slots
# (P2), the replace memo's scratch memo for unstamped calls (P1), the lean
# walker of instantiation (P3) and input leaf entries without a probe (P4).
# Read with tests/mutants/faults.toml as one list.

# ---- P2: a slot holds the entry and its hash; the hash decides only which
# entries same is asked about.

[[fault]]
id = "ks3-htab-growth-loses-hash"
file = "src/lib/htab.fs"
old = '''  >r htab-slot@ dup r@ htab-empty r> htab-slot htab-slot! ;'''
new = '''  >r htab-slot@ dup r@ htab-empty r> htab-slot nip 0 swap htab-slot! ;'''
test = "$GFORTH tests/lib/htab.fs"
reason = "growth moves an entry without its stored hash: every entry is lost to its finds"
quick = true

[[fault]]
id = "ks3-htab-removal-leaves-hash"
file = "src/lib/htab.fs"
old = ''': htab-shift ( hole j htab -- ) tuck htab-slot -rot htab-slot /htab-slot move ;'''
new = ''': htab-shift ( hole j htab -- ) tuck htab-slot -rot htab-slot 1 u32s move ;'''
test = "$GFORTH tests/lib/htab.fs"
reason = "Algorithm R moves an entry back without its hash: the hole's old hash hides it"
quick = true

[[fault]]
id = "ks3-htab-find-trusts-hash"
file = "src/lib/htab.fs"
old = '''    1- dup 2r@ htab-same if nip nip 2r> 2drop true exit then drop r@ htab-next'''
new = '''    1- dup 2r@ 2drop drop true if nip nip 2r> 2drop true exit then drop r@ htab-next'''
test = "$GFORTH tests/lib/htab.fs"
reason = "a find takes an equal stored hash for an equal entry, without asking same"
quick = true

[[fault]]
id = "ks3-htab-find-skips-equal-hash"
file = "src/lib/htab.fs"
old = '''  >r begin 2dup r@ htab-slot tuck htab-hash@ <> swap u32@ dup while'''
new = '''  >r begin 2dup r@ htab-slot tuck htab-hash@ = swap u32@ dup while'''
test = "$GFORTH tests/lib/htab.fs"
reason = "a find asks same only of entries whose hash differs, so it never finds one"

[[fault]]
id = "ks3-htab-find-ignores-hash"
file = "src/lib/htab.fs"
old = '''  >r begin 2dup r@ htab-slot tuck htab-hash@ <> swap u32@ dup while'''
new = '''  >r begin 2dup r@ htab-slot tuck 2drop false swap u32@ dup while'''
test = "$GFORTH tests/lib/htab.fs"
reason = "a find asks same of every entry of its run, the stored hash unused"

[[fault]]
id = "ks3-htab-put-wrong-hash"
file = "src/lib/htab.fs"
old = ''': htab-put ( n i h htab -- ) 1 over htab-entries +! >r swap r> htab-slot htab-slot! ;'''
new = ''': htab-put ( n i h htab -- ) 1 over htab-entries +! >r swap 1+ r> htab-slot htab-slot! ;'''
test = "$GFORTH tests/lib/htab.fs"
reason = "htab-put stores a hash other than the one given: the entry is never found"
quick = true

[[fault]]
id = "ks3-htab-enter-wrong-hash"
file = "src/lib/htab.fs"
old = ''': htab-enter ( n i htab -- ) 2 pick over htab-rehash swap htab-put ;'''
new = ''': htab-enter ( n i htab -- ) 2 pick over htab-rehash 1+ swap htab-put ;'''
test = "$GFORTH tests/lib/htab.fs"
reason = "htab-enter stores a hash other than rehash's"

[[fault]]
id = "ks3-htab-bytes-four"
file = "src/lib/htab.fs"
old = ''': htab-bytes ( htab -- u ) htab-slots /htab-slot * ;'''
new = ''': htab-bytes ( htab -- u ) htab-slots 4 * ;'''
test = "$GFORTH tests/lib/htab.fs"
reason = "a table's bytes counted at the old 4 a slot: memory reports miss half of every table"

[[fault]]
id = "ks3-htab-sound-blind"
file = "src/lib/htab.fs"
old = '''  tuck htab-slot htab-slot@ >r swap htab-rehash u32-mask and r> = ;'''
new = '''  tuck htab-slot htab-slot@ >r swap htab-rehash u32-mask and r> drop drop true ;'''
test = "$GFORTH tests/lib/htab.fs"
reason = "htab-sound? passes a stored hash that is not rehash's"

[[fault]]
id = "ks3-memo-index-wrong-hash"
file = "src/lib/memo.fs"
old = ''': memo-index ( n i memo -- ) dup memo-probe-hash @ swap memo-table htab-put ;'''
new = ''': memo-index ( n i memo -- ) 0 swap memo-table htab-put ;'''
test = "$GFORTH tests/lib/memo.fs"
reason = "a memo enters a key with a hash its finds never use: every key is lost"
quick = true

[[fault]]
id = "ks3-memo-look-keeps-no-hash"
file = "src/lib/memo.fs"
old = '''  2dup memo-hash 2dup swap memo-probe-hash ! swap memo-table htab-find ;'''
new = '''  2dup memo-hash swap memo-table htab-find ;'''
test = "$GFORTH tests/lib/memo.fs"
reason = "memo-look keeps no hash: a new entry is entered with the previous key's"

[[fault]]
id = "ks3-cons-find-keeps-no-hash"
file = "src/lib/cons.fs"
old = '''  2dup cons-hashed ! tuck cons-table htab-find ;'''
new = '''  tuck cons-table htab-find ;'''
test = "$GFORTH tests/lib/cons.fs"
reason = "cons-commit enters a new record with a stale hash, so it is not found again"

[[fault]]
id = "ks3-sought-keeps-no-hash"
file = "src/core/terms.fs"
old = '''  dup >r lf-sought! r@ dup lf-sought@ hash-3 dup r> lf-sought-hashed ! ;'''
new = '''  dup >r lf-sought! r@ dup lf-sought@ hash-3 0 r> lf-sought-hashed ! ;'''
test = "$GFORTH tests/core/terms.fs"
reason = "a new node is entered with hash 0, not its fields': hash-consing loses it"

# ---- P1: an unstamped call's entries in a scratch memo, keyed by the
# call's number, emptied whole above lf-rmemo-scratch-most.

[[fault]]
id = "ks3-rmemo-calls-share-number"
file = "src/kernel/replace-memo.fs"
old = '''  1 over lf-rmemo-calls +! dup lf-rmemo-calls @ negate swap lf-rmemo-stamp ! ;'''
new = '''  1 over lf-rmemo-calls +! -1 swap lf-rmemo-stamp ! ;'''
test = "$GFORTH tests/core/mixed-instantiate.fs"
reason = "every unstamped call has the same number: one call finds another's results"
quick = true

[[fault]]
id = "ks3-rmemo-scratch-never-emptied"
file = "src/kernel/replace-memo.fs"
old = '''  dup lf-rmemo-spent? if dup lf-rmemo-scratch memo-empty dup lf-rmemo-restart then drop ;'''
new = '''  drop ;'''
test = "$GFORTH tests/core/mixed-instantiate.fs"
reason = "the scratch memo is never emptied: it grows with every unstamped call of a run"

[[fault]]
id = "ks3-rmemo-sweep-empties-table"
file = "src/kernel/replace-memo.fs"
old = '''  dup lf-rmemo-spent? if dup lf-rmemo-scratch memo-empty dup lf-rmemo-restart then drop ;'''
new = '''  dup lf-rmemo-spent? if ['] memo-empty lf-rmemo-both else drop then ;'''
test = "$GFORTH tests/core/mixed-instantiate.fs"
reason = "emptying the scratch memo empties the stamped table too: kept closings are lost"

[[fault]]
id = "ks3-rmemo-end-holds-nothing"
file = "src/kernel/replace-memo.fs"
old = '''  dup lf-rmemo-scratch? if nip lf-rmemo-held! exit then'''
new = '''  dup lf-rmemo-scratch? if 2drop exit then'''
test = "$GFORTH tests/core/mixed-instantiate.fs"
reason = "an unstamped call's end leaves its entries counted, so the nested pass empties the memo"

[[fault]]
id = "ks3-rmemo-unstamped-in-table"
file = "src/kernel/replace-memo.fs"
old = ''': lf-rmemo-in ( memo -- memo' ) dup lf-rmemo-scratch? 0 lf-rmemo-scratch and + ;'''
new = ''': lf-rmemo-in ( memo -- memo' ) lf-rmemo-table ;'''
test = "$GFORTH tests/core/mixed-instantiate.fs"
reason = "unstamped entries go into the stamped table, never taken out"

# ---- P3: the lean walk of instantiation and the closed root.

[[fault]]
id = "ks3-walk-second-charged-early"
file = "src/kernel/open-walk.fs"
old = '''  2dup frame-save lf-walk-first over frame-save swap lf-term-first@ swap false ;'''
new = '''  2dup frame-save lf-walk-first over frame-save dup lf-walk-fuel? drop swap lf-term-first@ swap false ;'''
test = "$GFORTH tests/core/mixed-instantiate.fs"
reason = "a node's second child is charged before its first child's subtree is walked"
quick = true

[[fault]]
id = "ks3-walk-kept-uncharged"
file = "src/kernel/open-walk.fs"
old = '''  dup lf-walk-fuel? 0= if nip outcome-exhausted lf-walk-failed exit then lf-walk-seen ;'''
new = '''  lf-walk-seen ;'''
test = "$GFORTH tests/core/mixed-instantiate.fs"
reason = "a child's visit, kept or rebuilt, costs no fuel: fuel numbers fall"
quick = true

[[fault]]
id = "ks3-walk-second-at-root-depth"
file = "src/kernel/open-walk.fs"
old = '''  tuck frame-save 1 over frame-pick lf-walk-deeper lf-term-second@ swap false ;'''
new = '''  tuck frame-save 1 over frame-pick lf-term-second@ swap false ;'''
test = "$GFORTH tests/core/mixed-instantiate.fs"
reason = "a lambda's body is walked at the lambda's own binder depth"

[[fault]]
id = "ks3-walk-failure-keeps-cells"
file = "src/kernel/open-walk.fs"
old = '''  over ok? if exit then begin dup lf-walk-base? 0= while lf-walk-pop repeat ;'''
new = '''  ;'''
test = "$GFORTH tests/core/mixed-instantiate.fs"
reason = "a failure leaves the walk's cells and binder depth on the frames"

[[fault]]
id = "ks3-walk-binder-after-child"
file = "src/kernel/mixed-open.fs"
old = '''  2dup lf-rebuild-stuck? if 2drop lf-rebuild-deep true exit then drop false ;'''
new = '''  drop false ;'''
test = "$GFORTH tests/core/mixed-instantiate.fs"
reason = "a lambda at the binder limit is entered: its first child charged before the limit is met"
quick = true

[[fault]]
id = "ks3-walk-reads-unreadable"
file = "src/kernel/mixed-open.fs"
old = '''  2dup lf-open-readable? 0= if lf-rebuild-bad true exit then'''
new = '''  2dup 2drop'''
test = "$GFORTH tests/core/mixed-instantiate.fs"
reason = "the lean walk reads a node past the pass's mark or not live"

[[fault]]
id = "ks3-walk-bvar-unchecked"
file = "src/kernel/mixed-open.fs"
old = '''  over lf-open-bvar? 0= if lf-rebuild-bad exit then'''
new = '''  '''
test = "$GFORTH tests/core/mixed-instantiate.fs"
reason = "a bound variable that is no well-formed leaf is instantiated"

[[fault]]
id = "ks3-walk-unknown-tag-kept"
file = "src/kernel/mixed-open.fs"
old = '''    >r lf-rebuild-bad r> endcase ;'''
new = '''    >r lf-rebuild-keep r> endcase ;'''
test = "$GFORTH tests/core/mixed-instantiate.fs"
reason = "a leaf of a tag the pass does not know is kept"

[[fault]]
id = "ks3-closed-root-free"
file = "src/kernel/mixed-open.fs"
old = '''  -1 lf-open-fuel +! outcome-ok'''
new = '''  outcome-ok'''
test = "$GFORTH tests/core/mixed-instantiate.fs"
reason = "a closed root comes back without its unit of fuel"
quick = true

[[fault]]
id = "ks3-closed-root-without-fuel"
file = "src/kernel/mixed-open.fs"
old = '''  lf-open-frames dup frame-sound? swap frame-fuel @ 0> and and ;'''
new = '''  lf-open-frames frame-sound? and ;'''
test = "$GFORTH tests/core/mixed-instantiate.fs"
reason = "a closed root comes back with no fuel left, where the visit's admission is exhausted"

[[fault]]
id = "ks3-closed-root-free-variable"
file = "src/kernel/mixed-open.fs"
old = '''  lf-open-data@ if dup lf-data-loose 0= swap lf-data-fvar? 0= and else false then ;'''
new = '''  lf-open-data@ if lf-data-loose 0= else false then ;'''
test = "$GFORTH tests/core/mixed-instantiate.fs"
reason = "a root holding a free variable is given back unvisited: a dead one is never met"
