[[fault]]
id = "tb1-clear-locals-unchecked"
file = "src/front/meta-tactic/goal.fs"
old = ''': mcl-run ( goal fvar -- goal' ) mcl-known mcl-locals mcl-target lf-goal-clear lf-must ;'''
new = ''': mcl-run ( goal fvar -- goal' ) mcl-known mcl-target lf-goal-clear lf-must ;'''
test = "$GFORTH tests/front/tactics/clear/test.fs"
reason = "TB1: clear without its test of the other hypotheses: Lean's 'variable h depends on a' becomes the outcome face's bare refusal"

