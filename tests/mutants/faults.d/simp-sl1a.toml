reason = "SL1a: an rfl theorem's rewrite keeps its proof (useImplicitDefEqProof, Rewrite.lean:110), so n + 0 + 0 = n is no longer of_eq_true (eq_self n)"

[[fault]]
id = "step-check-after-increment"
file = "src/front/simp/main.fs"
old = ''': sm-count ( -- ) sm sm-steps @ sm sm-max @ > if lf-unported then 1 sm sm-steps +! ;'''
new = ''': sm-count ( -- ) 1 sm sm-steps +! sm sm-steps @ sm sm-max @ > if lf-unported then ;'''
test = "$GFORTH tests/front/tactics/simp-1/test.fs"
reason = "SL1a: the step check runs after the increment (Main.lean:683-686 checks first), one step short of maxSteps"

[[fault]]
id = "dsimp-guard-off"
file = "src/front/simp/main.fs"
old = ''': sm-dsimp ( a -- a ) dup sm-kept? 0= if lf-unported then ;'''
new = ''': sm-dsimp ( a -- a ) ;'''
