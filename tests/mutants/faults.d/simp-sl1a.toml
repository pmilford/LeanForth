[[fault]]
id = "new-depth-not-closed"
file = "src/front/meta-must.fs"
old = '''  }lf-mctx-depth swap ?dup if nip throw then lf-must ;'''
new = '''  drop ?dup if throw then ;'''
test = "$GFORTH tests/front/simp-meta.fs"
reason = "SL1a: withNewMCtxDepth's depth left open after xt"

[[fault]]
id = "post-before-pre"
file = "src/front/simp/main.fs"
old = '''  dup lf-simp-pre false lf-simp-rewrite? if rot drop true else false then ;'''
new = '''  dup lf-simp-post false lf-simp-rewrite? if rot drop true else false then ;'''
test = "$GFORTH tests/front/tactics/simp-1/test.fs"
reason = "SL1a: pre (rewritePre) asks the post theorems, so a post rule rewrites before a pre one (Rewrite.lean:536-547)"

[[fault]]
id = "cache-ignored"
file = "src/front/simp/main.fs"
old = '''  dup 0 sm-cache memo-at ?dup if nip 2@ true else false then ;'''
new = '''  false ;'''
test = "$GFORTH tests/front/tactics/simp-1/test.fs"
reason = "SL1a: simpLoop never finds a cached result (Main.lean:679-682), so a term met again costs steps"

[[fault]]
id = "congrfun-for-congrfun-prime"
file = "src/front/simp/types.fs"
old = '''  s" congrFun'" st-prefix st-e lf-term-first@ st-fe st-fh st-ae 4 lf-mk-app-n ;'''
new = '''  s" congrFun" st-prefix st-e lf-term-first@ st-fe st-fh st-ae 4 lf-mk-app-n ;'''
test = "$GFORTH tests/front/tactics/simp-1/test.fs"
reason = "SL1a: mkCongr' with the function's proof alone builds congrFun, not Lean's congrFun' (Types.lean:714)"

[[fault]]
id = "rfl-step-kept"
file = "src/front/simp/rewrite.fs"
old = '''  sr-rfl? if lf-simp-none true exit then'''
new = '''  false if lf-simp-none true exit then'''
