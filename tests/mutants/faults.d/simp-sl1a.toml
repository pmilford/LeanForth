[[fault]]
id = "perm-heads-only"
file = "src/front/simp/theorems.fs"
old = '''  >r 2dup sth-heads? if r> sth-args? else r> drop 2drop false then ;'''
new = '''  >r 2dup sth-heads? r> drop nip nip ;'''
