[[fault]]
id = "zeta-delta-ignored"
file = "src/front/whnf.fs"
old = '''  dup lf-fvar-let? lf-meta-no-zeta-delta lf-meta-on? and'''
new = '''  dup lf-fvar-let?'''
test = "$GFORTH tests/front/simp-meta.fs"
