reason = "SL1a: every argument eq, so simp would rewrite a type argument the others depend on"

[[fault]]
id = "kinds-no-fix"
file = "src/front/congr-thms.fs"
old = '''  ck-kinds slab-clear dup ['] ck-kind-at ok-each dup ok? if over ck-fix-all then ;'''
new = '''  ck-kinds slab-clear dup ['] ck-kind-at ok-each ;'''
test = "$GFORTH tests/front/simp-meta.fs"
