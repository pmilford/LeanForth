# Planted faults of simp slice SL1a-1 (plan row FE9, docs/design/TACTIC_SIMP.md
# section 6): the shared Meta words of branch simp-sl1a-1 (meta-config.fs's
# settings, discr-keys.fs's head-only keys, discr-tree.fs's match queries,
# congr-thms.fs's kinds); read with faults.toml as one list (scripts/mutants.py).
# The simp loop's own faults (post-before-pre, cache-ignored, rfl-step-kept,
# step-check-after-increment, congrfun-for-congrfun-prime, dsimp-guard-off,
# perm-heads-only, synth-class-quick, sort-symbolic-refused) are at the end, each
# caught by tests/front/tactics/simp-1/test.fs.

[[fault]]
id = "head-keys-full"
file = "src/front/discr-keys.fs"
old = '''  dk dk-head-only @ if drop dk-push-stars exit then'''
new = '''  dk dk-head-only @ if drop dk-push-all exit then'''
test = "$GFORTH tests/front/simp-meta.fs"
reason = "SL1a: a hypothesis's keys index its arguments (noIndexAtArgs ignored), so h : f 6 = 0 no longer matches f (2 * 3)"

[[fault]]
id = "settings-not-restored"
file = "src/front/meta-config.fs"
old = ''': mcfg-with-simp ( i*x xt flags kind -- j*x ) mcfg-simp lf-tr-reducible lf-meta-with ;'''
new = ''': mcfg-with-simp ( i*x xt flags kind -- j*x ) mcfg-simp lf-tr-reducible lf-meta-config! execute ;'''
test = "$GFORTH tests/front/simp-meta.fs"
reason = "SL1a: simp's configuration left in force after its scope (and after a THROW)"

[[fault]]
id = "settings-proj-mask"
file = "src/front/meta-config.fs"
old = '''  3 mcfg-proj-unit * or constant lf-meta-settings'''
new = '''  mcfg-proj-unit or constant lf-meta-settings'''
test = "$GFORTH tests/front/simp-meta.fs"
reason = "SL1a: withImplicitConfig and withInferTypeConfig keep proj := no (one bit of the field cleared)"

[[fault]]
id = "kinds-all-eq"
