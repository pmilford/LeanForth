reason = "plan 9.4.8l AA: a refused let-value walk in lf-whnf-stuck drops a cell of its caller's"

[[fault]]
id = "whnf-nat-one-argument-never-none"
file = "src/front/reduce-nat.fs"
old = '''  lf-nat-succ-name? if lf-term-second@ 0 lf-meta-nat-succ true else drop false then ;'''
new = '''  drop lf-term-second@ 0 lf-meta-nat-succ true ;'''
