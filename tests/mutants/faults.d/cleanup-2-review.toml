file = "src/kernel/whnf.fs"
old = '''  lf-whnf-spine-args ['] lf-whnf-apply ok-apply2 ;'''
new = '''  lf-whnf-spine-args ok-then? if lf-whnf-apply else 2drop -1 outcome-ok then ;'''
test = "$GFORTH tests/core/whnf.fs"
reason = "review cleanup-families-2 r11: unfold_definition's arguments that find no room are taken as applied (-1 ok)"

[[fault]]
id = "cf2r-reapply-keeps-value"
file = "src/kernel/whnf.fs"
