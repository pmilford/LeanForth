# Planted faults of the Forth review of cleanup-families-2 (2026-11-19,
# docs/development/forth-reviews/2026-11-19-cleanup-families-2.md) that no unit test
# caught before its fixes, named after the reviewer's r-numbers; each is caught by a
# unit test the fixes added.

[[fault]]
id = "cf2r-delta-of-failure-ok"
file = "src/kernel/whnf.fs"
old = '''  dup lf-whnf-lookup ['] lf-whnf-slot-delta ok-apply2 ;'''
new = '''  dup lf-whnf-lookup ok-then? if lf-whnf-slot-delta else 2drop -1 outcome-ok then ;'''
test = "$GFORTH tests/core/iota.fs"
reason = "review cleanup-families-2 r10: a failed lookup of a delta head (a slot not final, undecided or unsupported) is taken as a constant that does not unfold"

[[fault]]
id = "cf2r-delta-of-failure-unknown"
file = "src/kernel/whnf.fs"
old = '''  dup lf-whnf-lookup ['] lf-whnf-slot-delta ok-apply2 ;'''
