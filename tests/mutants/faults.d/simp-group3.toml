reason = "SL2: tryAutoCongrTheorem? (Types.lean:870) builds the automatic theorem's proof when an argument has one; dropped, decide (x = a) j becomes decide (x = b) j with no proof"

[[fault]]
id = "congr-lemmas-skipped"
file = "src/front/simp/congr.fs"
old = '''  dup lf-meta-head sc-congr-run ?dup if sc-lemmas else drop sc-default then ;'''
new = '''  dup lf-meta-head sc-congr-run 2drop sc-default ;'''
