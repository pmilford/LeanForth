new = ''': lfr-then-done ( frame -- ) drop lfr-unhold ;'''
test = "$GFORTH tests/front/tactics/blocks-2/test.fs"
reason = "TB2 blocks 2: the first then-block of a <;> b <;> c puts the goals aside back, so the second runs on them too: blocks-2 test.fs's at_rest text (hr, ' h by-exact on b = a) is 96, not 0"

[[fault]]
id = "tb2b2-settle-before-brace"
