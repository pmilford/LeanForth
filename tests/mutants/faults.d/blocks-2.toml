# Planted faults of tactic blocks, slice 2 (plan row TB2, piece F; design
# docs/design/TACTIC_BLOCKS.md 4): t1 <;> t2 and by-all-goals, the reader's then-step
# (tactic-syntax.fs), the runner's per-goal modes and tfr-held (tactic-run.fs) and goals.fs's
# lf-goals-next-open, read with faults.toml as one list (scripts/mutants.py). Each is caught
# by the test it names.

# ---- The design's four (TACTIC_BLOCKS.md 4, slice 2)
[[fault]]
id = "tb2b2-held-not-cleared"
file = "src/front/tactic-run.fs"
old = ''': lf-tac-again ( frame -- ) dup tfr-step @ 1+ over tfr-next ! lfr-unheld ;'''
new = ''': lf-tac-again ( frame -- ) dup tfr-step @ 1+ swap tfr-next ! ;'''
test = "$GFORTH tests/front/tactics/blocks-2/test.fs"
reason = "TB2 blocks 2: a re-run of a block's steps keeps the goals a chain held aside: blocks-2 test.fs's fake frame after lf-tac-again keeps tfr-held 7, not -1"

[[fault]]
id = "tb2b2-unfocus-first-then"
