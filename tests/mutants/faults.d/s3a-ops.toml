# Planted faults of slice S3a-ops (plan S3, Lean's operators in decide
# statements; the architect's word list .claude/work/briefs/OPS-WORDLIST.md),
# read with faults.toml as one list (scripts/mutants.py). C1: reduceDT's
# unfoldDefinition? in the discrimination-tree keys (src/front/discr-keys.fs).

[[fault]]
id = "dk-unfold-never"
file = "src/front/discr-keys.fs"
old = '''  if dk-unfolded else drop false then outcome-ok ;'''
new = '''  2drop false outcome-ok ;'''
test = "$GFORTH tests/front/instances.fs"
reason = "S3a-ops C1: reduceDT never takes unfoldDefinition?'s answer (the old gap): GE.ge Nat _ x z keeps its own key where Lean's is LE.le's"

[[fault]]
id = "dk-root-ignores-badkey"
file = "src/front/discr-keys.fs"
old = ''': dk-keep? ( e' -- flag ) dk-bad-key? dk-root? and ;'''
new = ''': dk-keep? ( e' -- flag ) drop false ;'''
test = "$GFORTH tests/front/instances.fs"
reason = "S3a-ops C1: a root takes an unfolding into a bad key (reduceUntilBadKey's isBadKey test skipped): GE.ge Nat _ alone keyed other where Lean keeps GE.ge"

[[fault]]
id = "dk-unfold-once"
file = "src/front/discr-keys.fs"
old = '''  if true outcome-ok else dk-eta then ;'''
new = '''  if dk-eta else dk-eta then ;'''
test = "$GFORTH tests/front/instances.fs"
reason = "S3a-ops C1: an unfolding is not reduced again (Lean's reduce recurses): outParam (outParam Nat) keyed outParam where Lean's key is Nat"

[[fault]]
id = "oc-no-result-flag-order"
file = "src/lib/outcome.fs"
old = ''': no-result-flag ( outcome -- -1 false outcome ) no-result false swap ;'''
new = ''': no-result-flag ( outcome -- -1 false outcome ) false no-result ;'''
test = "$GFORTH tests/lib/lib.fs"
reason = "review ops-c1 B1: lib/outcome.fs's no-result-flag leaves the three values out of their places (the outcome where the result belongs, -1 as the flag, 0 as the outcome), so a failed step reads as ok with flag true"

[[fault]]
id = "dk-unfold-swallow"
file = "src/front/discr-keys.fs"
old = '''  dup lf-meta-unfold ok-then2? 0= if nip no-result-flag exit then'''
new = '''  dup lf-meta-unfold ok-then2? 0= if drop false outcome-ok exit then'''
test = "$GFORTH tests/front/instances.fs"
reason = "S3a-ops C1, review ops-c1 B2 (its M1): a refusal of unfoldDefinition? (heap or room full, budget spent) answered as no unfolding, ok: GE.ge Nat _ x z keyed GE.ge where Lean's first key is LE.le, a wrong answer in place of full or exhausted"

[[fault]]
id = "dk-bad-key-pi"
file = "src/front/discr-keys.fs"
old = '''lf-tag-lit lf-tag-str lf-tag-constant lf-tag-fvar lf-tag-projection lf-tag-pi 6 lf-tags'''
new = '''lf-tag-lit lf-tag-str lf-tag-constant lf-tag-fvar lf-tag-projection 5 lf-tags'''
test = "$GFORTH tests/front/tactics/decide/test.fs"
reason = "S3a-ops C1, review ops-c1 B3 (its M2): a pi made a bad key (isBadKey, Main.lean:224): DecidableEq Nat at a root keeps DecidableEq where Lean's key is arrow"

[[fault]]
id = "dk-bad-key-proj"
file = "src/front/discr-keys.fs"
old = '''lf-tag-lit lf-tag-str lf-tag-constant lf-tag-fvar lf-tag-projection lf-tag-pi 6 lf-tags'''
new = '''lf-tag-lit lf-tag-str lf-tag-constant lf-tag-fvar lf-tag-pi 5 lf-tags'''
test = "$GFORTH tests/front/instances.fs"
reason = "S3a-ops C1, review ops-c1 B3 (its M3): a projection made a bad key (isBadKey, Main.lean:223): Prod.fst Nat Nat p at a root keeps Prod.fst where Lean's key is the projection Prod.0"

[[fault]]
id = "dk-key-head-mvar"
file = "src/front/discr-keys.fs"
old = '''lf-tag-lit lf-tag-str lf-tag-constant lf-tag-fvar lf-tag-projection lf-tag-pi 6 lf-tags'''
new = '''lf-tag-lit lf-tag-str lf-tag-constant lf-tag-fvar lf-tag-projection lf-tag-pi lf-tag-mvar 7 lf-tags'''
test = "$GFORTH tests/front/instances.fs"
reason = "S3a-ops C1, review ops-c1 B3 (its M6): a metavariable made a key head (isBadKey's `_ => true`, Main.lean:225): outParam ?m at a root unfolds to ?m, a star, where Lean keeps outParam"

[[fault]]
id = "fe-decide-skip-whnf-mul"
file = "src/front/tactics/decide.fs"
old = '''  dup lf-mk-decide dup tdc-whnf dup s" Bool.true" lf-meta-const-named?'''
new = '''  dup lf-mk-decide tdc-proof exit'''
test = 'out=$(GFORTH=$GFORTH bin/leanforth check --env tests/front/decide-slice.ndjson --elab-data tests/front/decide-slice.elab.ndjson tests/front/tactics/decide/w-dc-mul.lf); echo "$out" | grep -q "error 250 " || ! echo "$out" | grep -q "w_dc_mul: rejected"'
reason = "S3a-ops C1: fe-decide-skip-whnf on 6 * 7 = 43, whose `*` elaborates since C1: decide hands over of_decide_eq_true unreduced and the kernel, the judge, rejects it; caught only when the run prints w_dc_mul: rejected"

# C2-C4 (branch ops-symbols; owner, 2026-11-20): the notation words'
# registration and reading (src/front/reader.fs), rightact% (src/front/
# elab-term.fs), and the library word the registration's row check uses.

[[fault]]
id = "rd-op-swaps-operands"
file = "src/front/reader.fs"
old = ''': lfn-operands ( lhs rhs node -- node ) swap syn-c! swap syn-b! ;'''
new = ''': lfn-operands ( lhs rhs node -- node ) swap syn-b! swap syn-c! ;'''
test = "$GFORTH tests/front/front.fs"
reason = "S3a-ops C2: an operator's operands swapped (a > b built as Lean's b > a, the way > becomes a flipped <): n m - must have n on the left, as Lean's binop% HSub.hSub n m"

[[fault]]
id = "rd-sub-as-binrel"
file = "src/front/reader.fs"
old = '''s" HAdd.hAdd" syn-k-binop lfn-operator: +    s" HSub.hSub" syn-k-binop lfn-operator: -'''
new = '''s" HAdd.hAdd" syn-k-binop lfn-operator: +    s" HSub.hSub" syn-k-binrel lfn-operator: -'''
test = "$GFORTH tests/front/front.fs"
reason = "S3a-ops C2: - builds binrel% HSub.hSub where Lean's macro is binop% (Notation.lean:306): n m - must be a binop% node"

[[fault]]
id = "rd-op-skips-row-check"
file = "src/front/reader.fs"
old = '''  0= abort" reader.fs: a notation word its constant's row lacks" ;'''
new = '''  drop ;'''
test = "$GFORTH tests/front/front.fs"
reason = "S3a-ops C2: a notation word registered without the notation table's row check: LT.lt's meaning given to the syntax word $ loads where it must abort"

[[fault]]
id = "rd-notation-after-context"
file = "src/front/reader.fs"
old = ''': lfn-open ( -- ) context-sealed? abort" reader.fs: a notation word after context-new" ;'''
new = ''': lfn-open ( -- ) ;'''
test = "$GFORTH tests/front/front.fs"
reason = "review ops-symbols B1: the notation table, read in place by every context, is written after context-new: a registration then gets past the seal (∈ aborts only at its syntax word, + only as made twice)"

[[fault]]
id = "rd-notation-no-syntax-check"
file = "src/front/reader.fs"
old = '''  lfn-spelt lfn-syntax-word lfn-new-word ;'''
new = '''  lfn-spelt lfn-new-word ;'''
test = "$GFORTH tests/front/front.fs"
reason = "review ops-symbols B1: a registration whose word no syntax word has (∈, Membership.mem's row) lays its entry down before lfa-natural! aborts: the table keeps a 23rd entry"

[[fault]]
id = "rd-gt-operands-swapped"
file = "src/front/reader.fs"
old = '''  2 lfa-args lfn-two lfn-entry lfn-op-node lfn-operands lfn-value ;'''
new = '''  2 lfa-args lfn-two lfa-token s" >" compare 0= if swap then lfn-entry lfn-op-node lfn-operands lfn-value ;'''
test = "$GFORTH tests/front/front.fs"
reason = "review ops-symbols L2: > alone takes its operands swapped (n m > built as GT.gt m n, Lean's m > n), a slip the kernel cannot see when the swapped statement is also true"

[[fault]]
id = "rd-ge-operands-swapped"
file = "src/front/reader.fs"
old = '''  2 lfa-args lfn-two lfn-entry lfn-op-node lfn-operands lfn-value ;'''
new = '''  2 lfa-args lfn-two lfa-token s" ≥" compare 0= if swap then lfn-entry lfn-op-node lfn-operands lfn-value ;'''
test = "$GFORTH tests/front/front.fs"
reason = "review ops-symbols L2: ≥ alone takes its operands swapped (n m ≥ built as GE.ge m n, Lean's m ≥ n)"

[[fault]]
id = "rd-named-takes-spelling"
file = "src/front/reader.fs"
old = '''  lfn-entry lfn-entry-const lfn-root-const lfn-const-at lfn-apply ;'''
new = '''  lfn-entry name-entry-name lfn-root-const lfn-const-at lfn-apply ;'''
