# Planted faults of src/lib/name-table.fs added by branch fix-cli-present-2 (review N7
# of fix-cli-present, 2026-11-18); its first faults are in tests/mutants/faults.toml.
# Read with that file as one list.

[[fault]]
id = "lib-name-table-long-linked"
file = "src/lib/name-table.fs"
old = '''  over 255 > abort" name-entry: a name over 255 bytes"'''
new = ''''''
test = "$GFORTH tests/lib/name-table.fs"
reason = "a name over 255 bytes is linked into the table before counted, refuses it: the table ends in an entry with no name"

[[fault]]
id = "lib-name-table-base-kept"
file = "src/lib/name-table.fs"
old = '''base !   \ the BASE this file was loaded with'''
new = '''drop'''
test = "$GFORTH -e hex src/lib/name-table.fs -e 'base @ decimal 16 <> throw bye'"
reason = "loading the library leaves BASE decimal, not the caller's"
