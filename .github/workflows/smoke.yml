name: Smoke
on: [push, pull_request]
permissions:
  contents: read
jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install distribution Gforth
        run: sudo apt-get update && sudo apt-get install -y gforth
      - name: Report host version
        run: gforth --version
      - name: Run Forth tests
        run: make smoke test-harness test-core test-composition-fixture test-program
